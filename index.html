<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portfolio</title>

<!-- Icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<!-- Font -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>
*{
  margin:0;padding:0;box-sizing:border-box;
  font-family:'Poppins',sans-serif;
}

body{
  background:radial-gradient(circle at top,#0a0a0a,#000);
  color:#fff;
  text-align:center;
  padding:30px 15px;
}

/* Profile Image */
.profile{
  width:120px;
  height:120px;
  border-radius:50%;
  border:3px solid #7f00ff;
  box-shadow:0 0 25px #7f00ff;
  margin-bottom:20px;
}

/* Heading */
h1 span{
  background:linear-gradient(90deg,#7f00ff,#e100ff,#00d4ff);
  background-size:300%;
  -webkit-background-clip:text;
  color:transparent;
  animation:gradientMove 4s infinite linear;
}

p{
  opacity:.85;
  margin:15px auto;
  max-width:500px;
}

/* Tags */
.tag{
  border:1px solid #333;
  padding:8px 16px;
  border-radius:25px;
  margin:6px;
  display:inline-block;
  background:rgba(255,255,255,0.04);
  transition:.3s;
}
.tag:hover{
  background:#7f00ff;
  transform:translateY(-4px);
}

/* Cards */
.card{
  background:#111;
  padding:18px;
  margin:18px auto;
  border-radius:16px;
  width:90%;
  max-width:360px;
  box-shadow:0 10px 25px rgba(0,0,0,.6);
  transition:.3s;
}
.card:hover{
  transform:translateY(-6px);
  box-shadow:0 0 25px rgba(127,0,255,.4);
}

/* Resume Button */
.resume{
  display:inline-block;
  margin:25px 0;
  padding:12px 28px;
  border-radius:30px;
  background:linear-gradient(90deg,#7f00ff,#e100ff);
  color:#fff;
  text-decoration:none;
  font-weight:500;
}

/* Social Icons */
.socials a{
  color:#fff;
  font-size:22px;
  margin:0 12px;
  transition:.3s;
}
.socials a:hover{
  color:#7f00ff;
  transform:scale(1.2);
}

/* Scroll Animation */
.reveal{
  opacity:0;
  transform:translateY(40px);
  transition:1s;
}
.reveal.active{
  opacity:1;
  transform:none;
}

@keyframes gradientMove{
  0%{background-position:0%}
  100%{background-position:100%}
}
</style>
</head>

<body>

<!-- PROFILE IMAGE -->
<img src="profile.jpg" class="profile">

<h2 class="reveal">Hi! I'm</h2>
<h1 class="reveal"><span>YOUR NAME</span></h1>

<p class="reveal">
Artificial Intelligence Engineer | Frontend Developer | Tech Explorer
</p>

<div class="reveal">
  <span class="tag">AI Enthusiast</span>
  <span class="tag">Machine Learning</span>
  <span class="tag">Deep Learning</span>
  <span class="tag">Developer</span>
</div>

<a href="resume.pdf" class="resume reveal">Download Resume</a>

<div class="card reveal">
📍 <b>Location</b><br>Bengaluru, India
</div>

<div class="card reveal">
💼 <b>Expertise</b><br>AI / ML, Problem Solving
</div>

<div class="card reveal">
📧 <b>Contact</b><br>
<a href="mailto:yourmail@gmail.com">yourmail@gmail.com</a>
</div>

<div class="socials reveal">
  <a href="#"><i class="fab fa-github"></i></a>
  <a href="#"><i class="fab fa-linkedin"></i></a>
  <a href="#"><i class="fab fa-instagram"></i></a>
</div>

<script>
window.addEventListener('scroll',()=>{
  document.querySelectorAll('.reveal').forEach(el=>{
    if(el.getBoundingClientRect().top < window.innerHeight-50){
      el.classList.add('active');
    }
  });
});
</script>

</body>
  </html>
