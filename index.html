<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Amrut Hanamapure | Portfolio</title>

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

  <!-- Font Awesome Icons -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
  />

  <!-- Main CSS -->
  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <!-- ===== PROFILE IMAGE ===== -->
  <div class="profile reveal">
    <div class="profile">
  <img src="profile.jpg.png" alt="Amrut Hanamapure">
    </div>
  </div>

  <!-- ===== INTRO TEXT ===== -->
  <h2 class="reveal">Hi! I'm</h2>

  <h1 class="reveal">
    <span>Amrut Hanamapure</span>
  </h1>

  <p class="reveal">
    Electronics & Communication Engineering Student
  </p>

  <!-- ===== DETAILS LOAD AREA ===== -->
  <!-- Everything from details.html will appear here -->
  <div id="details"></div>

  <!-- ===== MAIN SCRIPT ===== -->
  <script src="script.js"></script>

  <!-- ===== LOAD DETAILS.HTML ===== -->
  <script>
    fetch("details.html")
      .then(response => response.text())
      .then(data => {
        document.getElementById("details").innerHTML = data;
      })
      .catch(error => {
        document.getElementById("details").innerHTML =
          "<p style='color:red'>Failed to load details.html</p>";
      });
  </script>

</body>
</html>
